run:
  name: learning-minimal
  seed: 42
  output_dir: artifacts
data:
  provider: pennfudan
  root: data/raw
  manifest_dir: data/manifests
  image_size: [128, 128]
  batch_size: 1
  num_workers: 0
  horizontal_flip: 0.0
  train_limit: 2
  valid_limit: 1
  test_limit: 1
model:
  name: maskrcnn_resnet50_fpn
  weights: none
  num_classes: 2
  params:
    min_size: 128
    max_size: 128
training:
  epochs: 2
  optimizer: sgd
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: none
  step_size: 6
  gamma: 0.1
  amp: false
  grad_clip_norm: null
  best_metric: mask_map
  evaluation_score_floor: 0.0
  score_threshold: 0.5
  mask_threshold: 0.5
  evaluate_every: 1
device: cpu

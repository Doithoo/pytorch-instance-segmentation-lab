[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-instance-segmentation-lab"
version = "0.1.0"
description = "Beginner-oriented reproducible PyTorch instance segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yashowhoo" }]
keywords = ["pytorch", "instance-segmentation", "mask-r-cnn", "computer-vision", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "torchmetrics>=1.4,<2",
    "pycocotools>=2.0.7,<3",
    "numpy>=1.24,<3",
    "pillow>=12,<13",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.6,<1",
    "mypy>=1.15,<3",
    "types-PyYAML>=6,<7",
    "pre-commit>=3,<5",
    "build>=1.2,<2",
    "twine>=5,<8",
    "matplotlib>=3.6,<4",
    "tomli>=2,<3; python_version < '3.11'",
]
plot = ["matplotlib>=3.6,<4"]

[project.urls]
Homepage = "https://github.com/Doithoo/pytorch-instance-segmentation-lab"
Repository = "https://github.com/Doithoo/pytorch-instance-segmentation-lab"
Documentation = "https://github.com/Doithoo/pytorch-instance-segmentation-lab#readme"
Source = "https://github.com/Doithoo/pytorch-instance-segmentation-lab"
Issues = "https://github.com/Doithoo/pytorch-instance-segmentation-lab/issues"

[project.scripts]
instance-segment = "instance_segmenter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
instance_segmenter = ["py.typed"]

[tool.setuptools.data-files]
"share/pytorch-instance-segmentation-lab/configs" = [
    "configs/custom_dataset_example.yaml",
    "configs/custom_model_example.yaml",
    "configs/learning_minimal.yaml",
    "configs/maskrcnn_resnet50_fpn.yaml",
    "configs/reference_maskrcnn.yaml",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts", "examples"]
extend-exclude = ["docs", "README.md", "README.zh-CN.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "tests"

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "examples"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torchvision", "torchvision.*", "torchmetrics", "torchmetrics.*", "pycocotools", "pycocotools.*", "kaggle_runner"]
ignore_missing_imports = true

      - Metrics: reference/metrics.md
      - Checkpoint schema: reference/checkpoint-schema.md
      - CLI and outputs: reference/cli-and-outputs.md
      - Model catalog: reference/model-zoo.md
      - Penn-Fudan: reference/penn-fudan.md

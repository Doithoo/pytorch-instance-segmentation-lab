site_name: PyTorch Instance Segmentation Lab
site_description: Reproducible, beginner-oriented PyTorch instance segmentation
repo_url: https://github.com/Doithoo/pytorch-instance-segmentation-lab
repo_name: Doithoo/pytorch-instance-segmentation-lab
docs_dir: docs
site_dir: build/site
strict: true
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: README.md
  - 中文首页: README.zh-CN.md
  - Tutorial:
      - Overview: tutorial/README.md
      - Basics: tutorial/00-basics.md
      - Environment: tutorial/01-environment.md
      - Data and instances: tutorial/02-data-and-instances.md
      - Mask R-CNN: tutorial/03-maskrcnn.md
      - Training: tutorial/04-training.md
      - Evaluation and inference: tutorial/05-evaluation-and-inference.md
  - 中文教程:
      - 导航: tutorial/README.zh-CN.md
      - 基础: tutorial/00-basics.zh-CN.md
      - 环境: tutorial/01-environment.zh-CN.md
      - 数据与实例: tutorial/02-data-and-instances.zh-CN.md
      - Mask R-CNN: tutorial/03-maskrcnn.zh-CN.md
      - 训练: tutorial/04-training.zh-CN.md
      - 评估与推理: tutorial/05-evaluation-and-inference.zh-CN.md
  - Concepts:
      - Configuration flow: concepts/configuration-flow.md
      - Instance target: concepts/instance-target.md
      - Mask R-CNN flow: concepts/maskrcnn-flow.md
      - Code tour: concepts/code-tour.md
  - 中文概念:
      - 配置流: concepts/configuration-flow.zh-CN.md
      - Instance target: concepts/instance-target.zh-CN.md
      - Mask R-CNN 流程: concepts/maskrcnn-flow.zh-CN.md
      - 代码导览: concepts/code-tour.zh-CN.md
  - Guides:
      - Choosing models: guides/choosing-models.md
      - Using models: guides/using-models.md
      - Using your data: guides/using-your-data.md
      - Experiments: guides/experiments.md
      - Kaggle: guides/kaggle.md
      - Troubleshooting: guides/troubleshooting.md
      - Adding models: guides/adding-models.md
      - Releasing: guides/releasing.md
  - 中文指南:
      - 模型选择: guides/choosing-models.zh-CN.md
      - 使用模型: guides/using-models.zh-CN.md
      - 使用自己的数据: guides/using-your-data.zh-CN.md

run:
  name: reference-maskrcnn
  seed: 42
  output_dir: /kaggle/working/artifacts
data:
  provider: pennfudan
  factory: null
  root: /kaggle/working/data
  manifest_dir: /kaggle/working/manifests
  image_size: null
  batch_size: 2
  num_workers: 2
  horizontal_flip: 0.5
  train_limit: null
  valid_limit: null
  test_limit: null
model:
  name: maskrcnn_resnet50_fpn
  factory: null
  weights: coco_v1
  num_classes: 2
  params: {}
training:
  epochs: 20
  optimizer: sgd
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: step
  step_size: 6
  gamma: 0.1
  amp: true
  grad_clip_norm: null
  best_metric: mask_map
  score_threshold: 0.5
  mask_threshold: 0.5
  evaluate_every: 1
device: cuda
